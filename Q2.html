<html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Card - Flexbox</title>

    <style>
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
        }

        
        .profile {
            width: 300px;
            padding: 30px;
            text-align: center;

            background-color: white;
            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        
        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;

            object-fit: cover;
        }

        
        .profile h1 {
            margin: 15px 0 5px;
        }
        
        .profile p {
            color: #666;
        }

        
        
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">

            <img src="https://img.magnific.com/free-vector/woman-with-long-brown-hair-pink-shirt_90220-2940.jpg?semt=ais_hybrid&w=740&q=80" alt="Profile Picture">

            <h1>Prity sharma</h1>

            <p>Web Developer & AI/ML Student</p>

            <p>
                Passionate about creating websites
                and learning artificial intelligence.
            </p>

        </div>

    </div>

</body>
</html>
