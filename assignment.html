<html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body {
    background-image: url("https://cdn.pixabay.com/photo/2017/12/20/14/53/clouds-3030063_1280.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Serif, sans-serif;
}

        .card {
            background: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            margin-left: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }

        #weather {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            font-family: Georgia, sans-serif;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city">
    <button onclick="getWeather()">Search</button>

    <div id="weather"></div>
</div>

<script>
async function getWeather() {
    let city = document.getElementById("city").value;
    let apiKey = "31f9a0cb8d8a7bec06464305af8edc7c";

    let url = `https://api.openweathermap.org/data/2.5/weather?q=${city},IN&appid=${apiKey}&units=metric`;

    let response = await fetch(url);
    let data = await response.json();

    if (response.ok) {
        document.getElementById("weather").innerHTML =
            "<h2>" + data.name + "</h2>" +
            "<p>Temperature: " + data.main.temp + " °C</p>" +
            "<p>Humidity: " + data.main.humidity + "%</p>" +
            "<p>Condition: " + data.weather[0].description + "</p>";
    } else {
        document.getElementById("weather").innerHTML =
            "Error: " + data.message;
    }
}
</script>

</body>
</html>
