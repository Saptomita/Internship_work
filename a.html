<html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Informal, sans-serif;
            background: #bbe7e4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            text-decoration: underline;
            text-transform: uppercase;
            font-weight: bold;
        }

        .gallery {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid black;
            cursor: pointer;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease,
                        filter 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;

            color: white;
            font-size: 45px;
            font-weight: bold;

            cursor: pointer;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>Interactive Image Gallery</h1>
    <div class="gallery">

        <img src="https://cdn.britannica.com/35/9435-050-8F2484A4/Mount-Sir-Donald-segment-Selkirk-Mountains-British.jpg"
            alt="Mountain">

        <img src="https://www.pugdundeesafaris.com/blog/wp-content/uploads/2024/12/tiger.webp"
            alt="Tiger">

        <img src="https://images.stockcake.com/public/9/b/b/9bbe9502-faf6-466a-9438-186e28ea3f13_large/sunrise-mountain-vista-stockcake.jpg"
            alt="Sunrise">

        <img src="https://cdn.britannica.com/91/110191-050-7BCFD56B/Victoria-Memorial-Hall-Kolkata-India.jpg"
            alt="Victoria Memorial">

        <img src="https://media.assettype.com/outlooktraveller/2024-05/243f93a6-303c-476a-b2ab-a377d44b6691/kolkata123.jpg?w=1200&ar=40%3A21&auto=format%2Ccompress&ogImage=true&mode=crop&enlarge=true&overlay=false&overlay_position=bottom&overlay_width=100"
            alt="Kolkata">

        <img src="https://www.peerlesshotels.com/blog/admin/assets/img/post/image_2025-11-18-11-12-25_691c5499dfac1.jpg"
            alt="Food of Kolkata">

        <img src="https://www.nathab.com/_image?href=https%3A%2F%2Fgood-nature-blog-uploads.s3.amazonaws.com%2Fuploads%2F2022%2F01%2Fgood-nature-homepage-hero_2-1280x640.jpg&w=1280&h=640"
            alt="Nature">

        <img src="https://cdn.britannica.com/87/2087-050-8B2A01CD/Mona-Lisa-oil-wood-panel-Leonardo-da.jpg"
            alt="Mona Lisa">

    </div>


    <div class="lightbox" id="lightbox">

        <span class="close" id="close">&times;</span>

        <img id="lightboxImage" src="" alt="Large Image">

    </div>


    <script>

        const images = document.querySelectorAll(".gallery img");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const close = document.getElementById("close");
        images.forEach(function(image) {

            image.addEventListener("click", function() {

                lightbox.style.display = "flex";
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt;

            });

        });

            close.addEventListener("click", function() {
                lightbox.style.display = "none";

        });


        
        lightbox.addEventListener("click", function(event) {

            if (event.target === lightbox) {

                lightbox.style.display = "none";

            }

        });

        document.addEventListener("keydown", function(event) {
                if (event.key === "Escape") {

                lightbox.style.display = "none";

            }

        });

    </script>

</body>
</html>
